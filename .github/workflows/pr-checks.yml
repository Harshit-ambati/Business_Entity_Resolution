name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/*]

jobs:
  test:
    name: Synthetic Fixture Tests and Git Diff Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'code/business_entity_resolution/requirements.txt'

      - name: Check whitespace and git diff errors
        run: |
          git diff --check HEAD~1 HEAD 2>/dev/null || git diff --check

      - name: Install package and dependencies
        run: |
          cd code/business_entity_resolution
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run synthetic pytest suite
        run: |
          cd code/business_entity_resolution
          python -m pytest -v --tb=short

      - name: Run synthetic H1 fixture smoke run
        run: |
          cd code/business_entity_resolution
          python src/tests/h1_fixture_run.py --work-dir /tmp/h1_smoke
